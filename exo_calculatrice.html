<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Calculatrice</title>
    <script src="js/calculatrice.js" defer></script>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
<h1>Calculatrice</h1>
<label for="nombre1"></label><input type="number" id="nombre1">
<label for="operation"></label><select id="operation">
    <option value="+">+</option>
    <option value="-">−</option>
    <option value="*">×</option>
    <option value="/">÷</option>
</select>
<label for="nombre2"></label><input type="number" id="nombre2">
<button id="calculer">Calculer</button>
<p id="resultat"></p>
</body>
</html>
