<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Catalogue de produits</title>
    <link rel="stylesheet" href="catalogue.css">
    <script src="catalogue.js" defer></script>
</head>
<body>
    <h1> Catalogue des produits</h1>

    <div class="actions">
        <button id="btn-tous">Tous</button>
        <button id="btn-en-stock">En stock</button>
        <button id="btn-prix-croissant">Prix croissant</button>
        <button id="btn-prix-decroissant">Prix décroissant</button>
        <button id="btn-nom">Nom A-Z</button>
    </div>
    <div>
        <input id="input-recherche" type="text" placeholder="Rechercher un produit">
        <button id="btn-recherche">Rechercher</button>
    </div>

    <p id="resume"></p>
    <ul id="catalogue"></ul>

    <h2>Ajouter un produit</h2>
    <div>
        <input id="input-nom" type="text" placeholder="Nom">
        <input id="input-prix" type="number" step="0.01" min="0" placeholder="Prix">
        <input id="input-stock" type="number" min="0" placeholder="Stock">
        <button id="btn-ajouter">Ajouter</button>
    </div> 
    <p id="message-ajout"></p>
</body>
</html>
